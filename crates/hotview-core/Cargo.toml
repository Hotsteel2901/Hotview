[package]
name = "hotview-core"
version = "0.1.0"
edition = "2024"
description = "Decoding and frame pipeline core for the Hotview media viewer"
license = "Apache-2.0"

[dependencies]
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
    "tiff",
    "ico",
    "qoi",
    "dds",
    "exr",
    "ff",
    "hdr",
    "pnm",
    "tga",
    "rayon",
] }
log = "0.4"
rayon = "1.12"
thiserror = "2"

# Only decoding, format, audio resampling and scaling are used (no avfilter
# or avdevice). Keeping those default features off trims the runtime
# dependency closure of every desktop package considerably.
ffmpeg-next = { version = "9.0", optional = true, default-features = false, features = [
    "codec",
    "format",
    "software-resampling",
    "software-scaling",
] }
# The `media`/`audio`/`nativewindow` features add -lmediandk, -laaudio and
# -lnativewindow to the link line. Without them the .so keeps undefined
# AMedia*/AAudio* symbols and fails to dlopen at runtime.
ndk-sys = { version = "0.6", optional = true, features = ["media", "audio"] }

[features]
default = []
# Desktop video/audio decoding through FFmpeg (C bindings).
ffmpeg = ["dep:ffmpeg-next"]
audio = ["ffmpeg"]
# Android hardware video decoding through NDK MediaCodec.
mediacodec = ["dep:ndk-sys"]
