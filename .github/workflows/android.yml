name: Android

on:
  # Manual only: run it from the Actions tab (or `gh workflow run android.yml`).
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # NDK r28c, the default of AGP 9.x.
  NDK_VERSION: "28.2.13676358"
  ANDROID_API: "37"
  # SDK root of the GitHub-hosted Ubuntu images (used for cache paths).
  ANDROID_SDK_ROOT_PATH: /usr/local/lib/android/sdk

jobs:
  apk:
    name: Build APK (${{ matrix.variant }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]
    env:
      # Signing: keystores come from repository secrets (never committed).
      KEYSTORE_RELEASE_B64: ${{ secrets.HOTVIEW_KEYSTORE_BASE64 }}
      KEYSTORE_DEBUG_B64: ${{ secrets.HOTVIEW_DEBUG_KEYSTORE_BASE64 }}
      HOTVIEW_KEYSTORE_PASSWORD: ${{ secrets.HOTVIEW_KEYSTORE_PASSWORD || 'hotsteel' }}
      HOTVIEW_KEY_ALIAS: ${{ secrets.HOTVIEW_KEY_ALIAS || 'hotsteel' }}
      HOTVIEW_KEY_PASSWORD: ${{ secrets.HOTVIEW_KEY_PASSWORD || 'hotsteel' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/rust -> target
          key: android-${{ matrix.variant }}

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      - name: Cache Android SDK (NDK / platform / build-tools)
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT_PATH }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.ANDROID_SDK_ROOT_PATH }}/platforms/android-${{ env.ANDROID_API }}.0
            ${{ env.ANDROID_SDK_ROOT_PATH }}/build-tools/36.0.0
          key: android-sdk-${{ runner.os }}-${{ env.ANDROID_API }}-36.0.0-${{ env.NDK_VERSION }}

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-$ANDROID_API.0" \
            "build-tools;36.0.0" \
            "ndk;$NDK_VERSION"

      - name: Prepare signing keystores
        working-directory: android
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_RELEASE_B64" ]; then
            printf '%s' "$KEYSTORE_RELEASE_B64" | base64 -d > keystore/hotview-release.jks
          fi
          if [ -n "$KEYSTORE_DEBUG_B64" ]; then
            printf '%s' "$KEYSTORE_DEBUG_B64" | base64 -d > keystore/hotview-debug.jks
          fi
          for name in hotview-release hotview-debug; do
            if [ -f "keystore/$name.jks" ]; then
              echo "found keystore/$name.jks"
            fi
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant gradlew execute permission
        run: chmod +x android/gradlew

      - name: Build ${{ matrix.variant }} APK
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          if [ "${{ matrix.variant }}" = "release" ]; then
            ./gradlew --no-daemon :app:assembleRelease
          else
            ./gradlew --no-daemon :app:assembleDebug
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: hotview-android-${{ matrix.variant }}
          path: |
            android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  aab:
    name: Build release AAB
    runs-on: ubuntu-26.04
    env:
      # Signing: keystores come from repository secrets (never committed).
      KEYSTORE_RELEASE_B64: ${{ secrets.HOTVIEW_KEYSTORE_BASE64 }}
      KEYSTORE_DEBUG_B64: ${{ secrets.HOTVIEW_DEBUG_KEYSTORE_BASE64 }}
      HOTVIEW_KEYSTORE_PASSWORD: ${{ secrets.HOTVIEW_KEYSTORE_PASSWORD || 'hotsteel' }}
      HOTVIEW_KEY_ALIAS: ${{ secrets.HOTVIEW_KEY_ALIAS || 'hotsteel' }}
      HOTVIEW_KEY_PASSWORD: ${{ secrets.HOTVIEW_KEY_PASSWORD || 'hotsteel' }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/rust -> target
          key: android-aab

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      - name: Cache Android SDK (NDK / platform / build-tools)
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT_PATH }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.ANDROID_SDK_ROOT_PATH }}/platforms/android-${{ env.ANDROID_API }}.0
            ${{ env.ANDROID_SDK_ROOT_PATH }}/build-tools/36.0.0
          key: android-sdk-${{ runner.os }}-${{ env.ANDROID_API }}-36.0.0-${{ env.NDK_VERSION }}

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-$ANDROID_API.0" \
            "build-tools;36.0.0" \
            "ndk;$NDK_VERSION"

      - name: Prepare signing keystores
        working-directory: android
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_RELEASE_B64" ]; then
            printf '%s' "$KEYSTORE_RELEASE_B64" | base64 -d > keystore/hotview-release.jks
          fi
          if [ -n "$KEYSTORE_DEBUG_B64" ]; then
            printf '%s' "$KEYSTORE_DEBUG_B64" | base64 -d > keystore/hotview-debug.jks
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant gradlew execute permission
        run: chmod +x android/gradlew

      - name: Build release bundle
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          ./gradlew --no-daemon :app:bundleRelease

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: hotview-android-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
