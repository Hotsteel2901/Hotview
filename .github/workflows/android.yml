name: Android

# One job builds the release APK (and, on request, a Play Store AAB). The old
# workflow compiled the same three Rust ABIs three times (debug APK, release
# APK and AAB) in three separate jobs; that was the biggest Actions spender.
on:
  workflow_dispatch:
    inputs:
      build_aab:
        description: "Also build the Play Store AAB"
        type: boolean
        default: false
  workflow_call:
    inputs:
      build_aab:
        description: "Also build the Play Store AAB"
        type: boolean
        default: false
    # Keystores come from repository secrets (never committed).
    secrets:
      HOTVIEW_KEYSTORE_BASE64:
        required: false
      HOTVIEW_DEBUG_KEYSTORE_BASE64:
        required: false
      HOTVIEW_KEYSTORE_PASSWORD:
        required: false
      HOTVIEW_KEY_ALIAS:
        required: false
      HOTVIEW_KEY_PASSWORD:
        required: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # NDK r28c, the default of AGP 9.x.
  NDK_VERSION: "28.2.13676358"
  ANDROID_API: "37"
  # SDK root of the GitHub-hosted Ubuntu images (used for cache paths).
  ANDROID_SDK_ROOT_PATH: /usr/local/lib/android/sdk

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Release APK
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      KEYSTORE_RELEASE_B64: ${{ secrets.HOTVIEW_KEYSTORE_BASE64 }}
      KEYSTORE_DEBUG_B64: ${{ secrets.HOTVIEW_DEBUG_KEYSTORE_BASE64 }}
      HOTVIEW_KEYSTORE_PASSWORD: ${{ secrets.HOTVIEW_KEYSTORE_PASSWORD || 'hotsteel' }}
      HOTVIEW_KEY_ALIAS: ${{ secrets.HOTVIEW_KEY_ALIAS || 'hotsteel' }}
      HOTVIEW_KEY_PASSWORD: ${{ secrets.HOTVIEW_KEY_PASSWORD || 'hotsteel' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Keep version.sh (commit count) consistent with the Release job.
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # One Rust cache for all three ABIs instead of one per job/variant.
      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: android/rust -> target
          key: android-release

      # cargo-ndk is a build tool, not a project dependency: cache the binary
      # instead of recompiling it on every release.
      - name: Cache cargo-ndk
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-v1

      - name: Install cargo-ndk
        run: |
          if ! command -v cargo-ndk >/dev/null 2>&1; then
            cargo install cargo-ndk --locked
          fi

      - name: Cache Android SDK (NDK / platform / build-tools)
        uses: actions/cache@v6
        with:
          path: |
            ${{ env.ANDROID_SDK_ROOT_PATH }}/ndk/${{ env.NDK_VERSION }}
            ${{ env.ANDROID_SDK_ROOT_PATH }}/platforms/android-${{ env.ANDROID_API }}.0
            ${{ env.ANDROID_SDK_ROOT_PATH }}/build-tools/36.0.0
          key: android-sdk-${{ runner.os }}-${{ env.ANDROID_API }}-36.0.0-${{ env.NDK_VERSION }}

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-$ANDROID_API.0" \
            "build-tools;36.0.0" \
            "ndk;$NDK_VERSION"

      - name: Prepare signing keystores
        working-directory: android
        run: |
          mkdir -p keystore
          if [ -n "$KEYSTORE_RELEASE_B64" ]; then
            printf '%s' "$KEYSTORE_RELEASE_B64" | base64 -d > keystore/hotview-release.jks
          fi
          if [ -n "$KEYSTORE_DEBUG_B64" ]; then
            printf '%s' "$KEYSTORE_DEBUG_B64" | base64 -d > keystore/hotview-debug.jks
          fi
          if [ -f keystore/hotview-release.jks ]; then
            echo "HOTVIEW_KEYSTORE=keystore/hotview-release.jks" >> "$GITHUB_ENV"
            echo "release keystore ready"
          else
            echo "no release keystore: falling back to the debug signature"
          fi
          if [ -f keystore/hotview-debug.jks ]; then
            echo "HOTVIEW_DEBUG_KEYSTORE=keystore/hotview-debug.jks" >> "$GITHUB_ENV"
            echo "debug keystore ready"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant gradlew execute permission
        run: chmod +x android/gradlew

      - name: Build release APK${{ inputs.build_aab && ' + AAB' || '' }}
        working-directory: android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${{ env.NDK_VERSION }}"
          VERSION_NAME=$(sh ../packaging/version.sh)
          VERSION_CODE=$(git -C .. rev-list --count HEAD)
          GRADLE_ARGS="--no-daemon -PversionName=$VERSION_NAME -PversionCode=$VERSION_CODE"
          if [ "${{ inputs.build_aab }}" = "true" ]; then
            ./gradlew $GRADLE_ARGS :app:assembleRelease :app:bundleRelease
          else
            ./gradlew $GRADLE_ARGS :app:assembleRelease
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: hotview-android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
