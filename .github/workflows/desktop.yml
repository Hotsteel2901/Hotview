name: Desktop

on:
  # Manual only: run it from the Actions tab (or `gh workflow run desktop.yml`).
  workflow_dispatch:
  # Also callable from release.yml (tag + GitHub Release).
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev libavfilter-dev libavdevice-dev \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64

      - name: Build
        run: cargo build --release -p hotview-desktop

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/hotview dist/
          cp README.md LICENSE dist/
          tar -C dist -czf hotview-linux-x86_64.tar.gz .

      - uses: actions/upload-artifact@v7
        with:
          name: hotview-linux-x86_64
          path: hotview-linux-x86_64.tar.gz
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple silicon
            arch: arm64
          - runner: macos-26-intel    # Intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7

      - name: Install FFmpeg
        run: |
          brew install ffmpeg pkg-config
          echo "PKG_CONFIG_PATH=$(brew --prefix ffmpeg)/lib/pkgconfig" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.arch }}

      - name: Build
        run: cargo build --release -p hotview-desktop

      - name: Bundle FFmpeg dylibs
        run: |
          brew install dylibbundler
          mkdir -p dist
          cp target/release/hotview dist/
          cp README.md LICENSE dist/
          dylibbundler -od -b -x dist/hotview -d dist/libs \
            -p @executable_path/libs/ \
            -s /opt/homebrew/lib -s /usr/local/lib
          for dylib in dist/libs/*.dylib; do
            [ -f "$dylib" ] && codesign --force --sign - "$dylib"
          done
          codesign --force --sign - dist/hotview

      - name: Package
        run: |
          tar -C dist -czf hotview-macos-${{ matrix.arch }}.tar.gz .

      - uses: actions/upload-artifact@v7
        with:
          name: hotview-macos-${{ matrix.arch }}
          path: hotview-macos-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  windows:
    name: Windows x86_64
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Install FFmpeg (MSYS2 / MinGW)
        shell: cmd
        run: C:\msys64\usr\bin\bash.exe -lc "pacman -Sy --noconfirm mingw-w64-x86_64-ffmpeg mingw-w64-x86_64-pkgconf"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64-gnu

      - name: Build
        env:
          # host (msvc) != target (gnu), so pkg-config needs this to query the
          # MSYS2 MinGW .pc files for the GNU target.
          PKG_CONFIG_ALLOW_CROSS: "1"
          PKG_CONFIG_PATH: C:\msys64\mingw64\lib\pkgconfig
        run: |
          export PATH="/c/msys64/mingw64/bin:$PATH"
          cargo build --release -p hotview-desktop --target x86_64-pc-windows-gnu

      - name: Package
        run: |
          export PATH="/c/msys64/mingw64/bin:/c/msys64/usr/bin:$PATH"
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/hotview.exe dist/
          cp README.md LICENSE dist/
          for pattern in avcodec-*.dll avdevice-*.dll avfilter-*.dll avformat-*.dll avutil-*.dll swresample-*.dll swscale-*.dll; do
            cp C:/msys64/mingw64/bin/$pattern dist/ 2>/dev/null || true
          done
          while true; do
            added=0
            for bin in dist/*.exe dist/*.dll; do
              [ -f "$bin" ] || continue
              for dep in $(objdump -p "$bin" 2>/dev/null | awk '/DLL Name:/ {print $3}'); do
                if [ ! -f "dist/$dep" ] && [ -f "C:/msys64/mingw64/bin/$dep" ]; then
                  cp "C:/msys64/mingw64/bin/$dep" dist/
                  added=1
                fi
              done
            done
            [ "$added" -eq 0 ] && break
          done
          ls -la dist/avcodec-*.dll
          7z a hotview-windows-x86_64.zip ./dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: hotview-windows-x86_64
          path: hotview-windows-x86_64.zip
          if-no-files-found: error
